<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rif50 | Excellence in Motion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 3D Canvas for Three.js -->
    <canvas id="rif-webgl-canvas"></canvas>

    <main class="overlay">
        <nav>
            <div class="logo-text">RIF50</div>
            <div class="status">COLLECTION I — 2026</div>
        </nav>

        <section class="hero-content">
            <h1 class="reveal-text">THE NEW STANDARD</h1>
            <p class="sub-reveal">Coming Summer 2026</p>
            
            <!-- Newsletter Capture -->
            <div class="email-capture">
                <input type="email" placeholder="ENTER THE INNER CIRCLE">
                <button>NOTIFY ME</button>
            </div>
        </section>

        <footer>
            <span>ESTABLISHED IN NORTH AFRICA</span>
            <div class="socials">IG / TW / FB</div>
        </footer>
    </main>
</body>
</html>
