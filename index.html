<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rif50 | Coming Soon</title>
    <style>
        :root {
            --charcoal: #121212;
            --safety-orange: #FF6600;
            --glass-white: rgba(255, 255, 255, 0.05);
            --text-gray: #a0a0a0;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--charcoal);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Subtle animated background */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #1e1e1e 0%, #121212 100%);
            z-index: -1;
        }

        .container {
            text-align: center;
            padding: 3rem;
            background: var(--glass-white);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 90%;
        }

        .logo-container img {
            width: 180px;
            height: auto;
            margin-bottom: 2rem;
            filter: drop-shadow(0 0 10px rgba(255, 102, 0, 0.2));
        }

        h1 {
            font-size: 1.2rem;
            letter-spacing: 0.5rem;
            text-transform: uppercase;
            margin-bottom: 1rem;
            color: var(--safety-orange);
            font-weight: 300;
        }

        p {
            color: var(--text-gray);
            line-height: 1.6;
            margin-bottom: 2.5rem;
            font-weight: 300;
        }

        .status-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: rgba(255, 102, 0, 0.1);
            border: 1px solid var(--safety-orange);
            color: var(--safety-orange);
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .footer {
            position: absolute;
            bottom: 2rem;
            font-size: 0.8rem;
            color: #444;
            letter-spacing: 1px;
        }

        .footer a {
            color: #666;
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer a:hover {
            color: var(--safety-orange);
        }
    </style>
</head>
<body>

    <div class="bg-gradient"></div>

    <div class="container">
        <div class="status-badge">Under Construction</div>
        
        <div class="logo-container">
            <!-- Replace with your uploaded R50 logo path -->
            <img src="rif50-logo.png" alt="Rif50 Logo">
        </div>

        <h1>Rif50</h1>
        <p>Crafting a premium digital experience. Something exceptional is currently in development.</p>
    </div>

    <div class="footer">
        &copy; 2026 Rif50 | Created by <a href="https://instagram.com/medbunz" target="_blank">Medbunz</a>
    </div>

</body>
</html>
