<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التصميم الجرافيكي والتراثي</title>
    <style>
        /* الإعدادات العامة */
        body {
            margin: 0;
            padding: 0;
            background-color: #111111; /* اللون المطلوب للخلفية */
            color: #4C0808; /* لون الكتابة والمحتوى */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* حاوية الواجهة ثلاثية الأبعاد */
        .hero-section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            background: radial-gradient(circle, #1a1a1a 0%, #111111 100%);
        }

        /* مكان الشعار */
        .logo-container {
            position: absolute;
            top: 40px;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 2px;
            border: 2px solid #4C0808;
            padding: 10px 20px;
            text-transform: uppercase;
        }

        /* المحتوى الرئيسي */
        .main-content {
            z-index: 2;
            max-width: 800px;
            padding: 20px;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(76, 8, 8, 0.3);
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            opacity: 0.9;
        }

        /* منطقة المحاكاة للواجهة ثلاثية الأبعاد */
        .canvas-placeholder {
            width: 100%;
            height: 400px;
            margin-top: 20px;
            border: 1px dashed #4C0808;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            background: rgba(76, 8, 8, 0.05);
            backdrop-filter: blur(5px);
            transition: transform 0.3s ease;
        }

        .canvas-placeholder:hover {
            transform: scale(1.02);
        }

        /* أزرار التفاعل */
        .btn {
            margin-top: 30px;
            padding: 12px 35px;
            background-color: transparent;
            color: #4C0808;
            border: 1px solid #4C0808;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: #4C0808;
            color: #111111;
        }

    </style>
</head>
<body>

    <section class="hero-section">
        <!-- مكان الشعار -->
        <div class="logo-container">
            LOGO
        </div>

        <div class="main-content">
            <h1>إبداع بصري بروح تراثية</h1>
            <p>
                نمزج بين حداثة التصميم الجرافيكي وعمق التراث الأصيل. 
                هنا نصمم الهوية البصرية بأسلوب يجمع بين عراقة الماضي وتقنيات المستقبل ثلاثية الأبعاد.
            </p>

            <!-- هنا يتم دمج ملفات الـ 3D مثل Three.js أو Spline -->
            <div class="canvas-placeholder">
                <span>[ منطقة عرض العناصر ثلاثية الأبعاد ]</span>
            </div>

            <button class="btn">استكشف الأعمال</button>
        </div>
    </section>

</body>
</html>
