<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIF50 | Coming Soon</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap');

        :root {
            --bg-color: #111111;
            --brand-color: #4C0808;
            --text-muted: rgba(255, 255, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Set the solid background color */
            background-color: var(--bg-color);
            color: var(--brand-color);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
        }

        .container {
            max-width: 800px;
            padding: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-container {
            margin-bottom: 2rem;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-img {
            max-width: 240px;
            height: auto;
            user-select: none;
            transition: transform 0.5s ease;
        }

        .logo-img:hover {
            transform: scale(1.02);
        }

        .headline {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.8rem;
            margin-top: 1rem;
            color: var(--text-muted);
            padding-left: 0.8rem;
            animation: fadeIn 2s ease-out;
        }

        .footer {
            position: fixed;
            bottom: 40px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 60px;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.25rem;
            color: var(--text-muted);
            z-index: 10;
        }

        .footer b {
            color: rgba(255, 255, 255, 0.7);
            font-weight: 700;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .footer {
                flex-direction: column;
                gap: 1.2rem;
                bottom: 30px;
                padding: 0 20px;
                align-items: center;
                letter-spacing: 0.15rem;
            }
            .headline {
                letter-spacing: 0.4rem;
                font-size: 0.65rem;
            }
            .logo-img {
                max-width: 180px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <img src="https://www.rif50.com/r50.png" alt="RIF50 Logo" class="logo-img" onerror="this.style.display='none'; document.getElementById('fallback-text').style.display='block';">
            <h1 id="fallback-text" style="display:none; font-size: 3rem; letter-spacing: 1rem;">RIF50</h1>
        </div>
        
        <p class="headline">Evolution in progress</p>
    </div>

    <div class="footer">
        <div>Nador • Morocco</div>
        <div>Created by <b>Medbunz</b></div>
    </div>

</body>
</html>
