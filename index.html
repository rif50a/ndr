<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIF50 | Coming Soon</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap');

        :root {
            --bg-color: #111111;
            --brand-color: #4C0808;
            --text-muted: rgba(255, 255, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--brand-color);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
        }

        /* Ambient Glow */
        .glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(76, 8, 8, 0.15) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            max-width: 800px;
            padding: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-container {
            margin-bottom: 3rem;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-img {
            max-width: 280px; /* Adjust size as needed */
            height: auto;
            filter: drop-shadow(0 0 20px rgba(76, 8, 8, 0.4));
            user-select: none;
        }

        .headline {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.8rem;
            margin-bottom: 3rem;
            color: var(--text-muted);
            padding-left: 0.8rem; /* center fix for letter spacing */
        }

        .services {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.5rem;
            max-width: 600px;
            margin: 0 auto 3rem auto;
            opacity: 0.8;
        }

        .service-item {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.2rem;
            border: 1px solid rgba(76, 8, 8, 0.3);
            padding: 8px 16px;
            border-radius: 2px;
            transition: all 0.3s ease;
            cursor: default;
        }

        .service-item:hover {
            border-color: var(--brand-color);
            background: var(--brand-color);
            color: white;
        }

        .footer {
            position: fixed;
            bottom: 40px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.3rem;
            color: var(--text-muted);
        }

        .footer b {
            color: white;
            font-weight: 700;
        }

        @media (max-width: 600px) {
            .footer {
                flex-direction: column;
                gap: 1rem;
                bottom: 20px;
                padding: 0 20px;
                align-items: center;
            }
            .headline {
                letter-spacing: 0.4rem;
            }
            .logo-img {
                max-width: 200px;
            }
        }
    </style>
</head>
<body>

    <div class="glow"></div>

    <div class="container">
        <div class="logo-container">
            <!-- PASTE YOUR LOGO LINK BELOW IN THE src ATTRIBUTE -->
            <img src="https://www.rif50.com/r50.png" alt="RIF50 Logo" class="logo-img">
        </div>
        
        <p class="headline">Evolution in progress</p>

    <div class="footer">
        <div>Nador • Morocco</div>
        <div>Created by <b>Medbunz</b></div>
    </div>

</body>
</html>
